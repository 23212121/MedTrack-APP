      - paragraph [ref=f1e25]: "Track Your Doctor explains the full MedTrack application: a medical visit tracker for clinics and hospitals. It is not a full EHR, lab system, insurance engine, or telemedicine app."
    - generic [ref=f1e26]:
      - heading "What MedTrack is" [level=2] [ref=f1e27]
      - paragraph [ref=f1e28]: MedTrack is built so front-desk staff can create a visit from a phone call in under 45 seconds, doctors can run a minimal queue, and patients always see doctor name, fixed appointment time, token, and when the consult is likely.
      - paragraph [ref=f1e29]:
        - text: The product covers schedules, bookings, tokens, delays, fees, documents, chat, medicine orders, and hospital HR. Status changes that affect the patient notify on
