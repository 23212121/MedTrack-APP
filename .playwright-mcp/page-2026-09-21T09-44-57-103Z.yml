      - generic [ref=f21e62]:
        - paragraph [ref=f21e63]: Three beats
        - heading "How patients track a doctor" [level=2] [ref=f21e64]
      - paragraph [ref=f21e65]: Doctor name, fixed appointment time, token, and consult-when stay visible for every visit. Staff book from a phone call in under 45 seconds. Doctors run a simple queue.
      - generic [ref=f21e66]:
        - article [ref=f21e67]:
          - generic [ref=f21e68]: "1"
          - heading "Book" [level=3] [ref=f21e69]
          - paragraph [ref=f21e70]: Desk staff or the patient books a doctor and slot. Confirmation goes out immediately.
        - article [ref=f21e71]:
          - generic [ref=f21e72]: "2"
          - heading "Arrive & check in" [level=3] [ref=f21e73]
          - paragraph [ref=f21e74]: A token is issued. The live queue shows wait time and “you’re next”.
        - article [ref=f21e75]:
          - generic [ref=f21e76]: "3"
          - heading "Consult" [level=3] [ref=f21e77]
          - paragraph [ref=f21e78]: The doctor starts, can mark delay, then completes. Overtime fees notify the patient.
