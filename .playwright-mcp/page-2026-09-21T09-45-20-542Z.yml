      - generic [ref=f26e62]:
        - paragraph [ref=f26e63]: Three beats
        - heading "How patients track a doctor" [level=2] [ref=f26e64]
      - paragraph [ref=f26e65]: Doctor name, fixed appointment time, token, and consult-when stay visible for every visit. Staff book from a phone call in under 45 seconds. Doctors run a simple queue.
      - generic [ref=f26e66]:
        - article [ref=f26e67]:
          - generic [ref=f26e68]: "1"
          - heading "Book" [level=3] [ref=f26e69]
          - paragraph [ref=f26e70]: Desk staff or the patient books a doctor and slot. Confirmation goes out immediately.
        - article [ref=f26e71]:
          - generic [ref=f26e72]: "2"
          - heading "Arrive & check in" [level=3] [ref=f26e73]
          - paragraph [ref=f26e74]: A token is issued. The live queue shows wait time and “you’re next”.
        - article [ref=f26e75]:
          - generic [ref=f26e76]: "3"
          - heading "Consult" [level=3] [ref=f26e77]
          - paragraph [ref=f26e78]: The doctor starts, can mark delay, then completes. Overtime fees notify the patient.
