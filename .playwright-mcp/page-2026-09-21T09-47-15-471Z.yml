      - generic [ref=f29e62]:
        - paragraph [ref=f29e63]: Three beats
        - heading "How patients track a doctor" [level=2] [ref=f29e64]
      - paragraph [ref=f29e65]: Doctor name, fixed appointment time, token, and consult-when stay visible for every visit. Staff book from a phone call in under 45 seconds. Doctors run a simple queue.
      - generic [ref=f29e66]:
        - article [ref=f29e67]:
          - generic [ref=f29e68]: "1"
          - heading "Book" [level=3] [ref=f29e69]
          - paragraph [ref=f29e70]: Desk staff or the patient books a doctor and slot. Confirmation goes out immediately.
        - article [ref=f29e71]:
          - generic [ref=f29e72]: "2"
          - heading "Arrive & check in" [level=3] [ref=f29e73]
          - paragraph [ref=f29e74]: A token is issued. The live queue shows wait time and “you’re next”.
        - article [ref=f29e75]:
          - generic [ref=f29e76]: "3"
          - heading "Consult" [level=3] [ref=f29e77]
          - paragraph [ref=f29e78]: The doctor starts, can mark delay, then completes. Overtime fees notify the patient.
