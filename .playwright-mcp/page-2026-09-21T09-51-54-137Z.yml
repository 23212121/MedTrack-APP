        - heading "How patients track a doctor" [level=2] [ref=f32e64]
      - paragraph [ref=f32e65]: Doctor name, fixed appointment time, token, and consult-when stay visible for every visit. Staff book from a phone call in under 45 seconds. Doctors run a simple queue.
      - generic [ref=f32e66]:
        - article [ref=f32e67]:
          - generic [ref=f32e68]: "1"
          - heading "Book" [level=3] [ref=f32e69]
          - paragraph [ref=f32e70]: Desk staff or the patient books a doctor and slot. Confirmation goes out immediately.
        - article [ref=f32e71]:
          - generic [ref=f32e72]: "2"
          - heading "Arrive & check in" [level=3] [ref=f32e73]
          - paragraph [ref=f32e74]: A token is issued. The live queue shows wait time and “you’re next”.
        - article [ref=f32e75]:
          - generic [ref=f32e76]: "3"
          - heading "Consult" [level=3] [ref=f32e77]
          - paragraph [ref=f32e78]: The doctor starts, can mark delay, then completes. Overtime fees notify the patient.
