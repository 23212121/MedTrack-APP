        - heading "How patients track a doctor" [level=2] [ref=f12e63]
      - paragraph [ref=f12e64]: Doctor name, fixed appointment time, token, and consult-when stay visible for every visit. Staff book from a phone call in under 45 seconds. Doctors run a simple queue.
      - generic [ref=f12e65]:
        - article [ref=f12e66]:
          - generic [ref=f12e67]: "1"
          - heading "Book" [level=3] [ref=f12e68]
          - paragraph [ref=f12e69]: Desk staff or the patient books a doctor and slot. Confirmation goes out immediately.
        - article [ref=f12e70]:
          - generic [ref=f12e71]: "2"
          - heading "Arrive & check in" [level=3] [ref=f12e72]
          - paragraph [ref=f12e73]: A token is issued. The live queue shows wait time and “you’re next”.
        - article [ref=f12e74]:
          - generic [ref=f12e75]: "3"
          - heading "Consult" [level=3] [ref=f12e76]
          - paragraph [ref=f12e77]: The doctor starts, can mark delay, then completes. Overtime fees notify the patient.
