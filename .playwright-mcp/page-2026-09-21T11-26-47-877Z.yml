      - generic [ref=f16e61]:
        - paragraph [ref=f16e62]: Three beats
        - heading "How patients track a doctor" [level=2] [ref=f16e63]
      - paragraph [ref=f16e64]: Doctor name, fixed appointment time, token, and consult-when stay visible for every visit. Staff book from a phone call in under 45 seconds. Doctors run a simple queue.
      - generic [ref=f16e65]:
        - article [ref=f16e66]:
          - generic [ref=f16e67]: "1"
          - heading "Book" [level=3] [ref=f16e68]
          - paragraph [ref=f16e69]: Desk staff or the patient books a doctor and slot. Confirmation goes out immediately.
        - article [ref=f16e70]:
          - generic [ref=f16e71]: "2"
          - heading "Arrive & check in" [level=3] [ref=f16e72]
          - paragraph [ref=f16e73]: A token is issued. The live queue shows wait time and “you’re next”.
        - article [ref=f16e74]:
          - generic [ref=f16e75]: "3"
          - heading "Consult" [level=3] [ref=f16e76]
          - paragraph [ref=f16e77]: The doctor starts, can mark delay, then completes. Overtime fees notify the patient.
