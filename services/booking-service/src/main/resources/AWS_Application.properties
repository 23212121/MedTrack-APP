# =============================================================================
# AWS_Application.properties — Amazon S3 settings for MedTrack documents
# Loaded by AWSApplicationConfig / AWSDocument
# Override any value with env vars if needed (MEDTRACK_S3_*).
# =============================================================================

# Enable / disable S3 connect, upload, download
aws.s3.enabled=true

# Bucket name
aws.s3.bucket=medtrack-demo-docs

# AWS region (e.g. ap-south-1, us-east-1, eu-west-1)
aws.s3.region=ap-south-1

# Access key ID
aws.s3.access-key=DEMOACCESSKEY123456

# Secret access key
aws.s3.secret-key=DEMOSECRETKEY123456789012345678901

# Object key prefix for patient documents (stored in svc.documents.file_path)
aws.s3.prefix=patient-documents

# Optional: endpoint override (leave blank for standard AWS)
aws.s3.endpoint=

# Optional: path-style access (true for some S3-compatible stores)
aws.s3.path-style-access=false
