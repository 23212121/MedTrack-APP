server:
  # Single API port (avoids Apache httpd on :8080)
  port: 8090

spring:
  application:
    name: medtrack-app
  config:
    # Load AWS S3 enabled/region/bucket/keys from AWS_Application.properties
    import: optional:classpath:AWS_Application.properties
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medtrackapp?currentSchema=svc}
    username: ${SPRING_DATASOURCE_USERNAME:medtrack}
    password: ${SPRING_DATASOURCE_PASSWORD:medtrack}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_schema: svc
        dialect: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
  mail:
    # Real inbox delivery: set MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_USER MAIL_PASS (Gmail App Password)
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB

medtrack:
  clinic-id: seed-clinic-1
  hospital-id: 10001
  clinic-name: Sunrise Care Clinic
  doctor-id: seed-doctor-1
  doctor-name: Dr. Mehta
  patient-id: seed-patient-1
  patient-name: Anita Sharma
  patient-phone: "9876543210"
  patient-email: anita@example.com
  default-clinic-id: seed-clinic-1
  default-clinic-name: Sunrise Care Clinic
  avg-consultation-minutes: 10
  sms-provider: console
  email-from: ${MAIL_FROM:${MAIL_USER:azherkhan061@gmail.com}}
  # Inbox that receives Send-message form details (defaults to the app mailbox)
  contact-to: ${MAIL_CONTACT_TO:azherkhan061@gmail.com}
  # false = do not pretend email was sent when SMTP fails (recommended for real Gmail)
  console-fallback: ${MAIL_CONSOLE_FALLBACK:false}
  auth:
    token-secret: ${MEDTRACK_AUTH_SECRET:medtrack-local-auth-secret-change-me}
    token-ttl-hours: ${MEDTRACK_AUTH_TTL_HOURS:12}
  # Hospital patient test-document uploads (svc.documents)
  upload-dir: ${MEDTRACK_UPLOAD_DIR:uploads/patient-documents}
  # S3 settings are loaded from AWS_Application.properties (aws.s3.*)
  # Keep medtrack.s3.* as optional env overrides for older scripts
  s3:
    enabled: ${MEDTRACK_S3_ENABLED:${aws.s3.enabled:true}}
    bucket: ${MEDTRACK_S3_BUCKET:${aws.s3.bucket:medtrack-demo-docs}}
    region: ${MEDTRACK_S3_REGION:${aws.s3.region:ap-south-1}}
    access-key: ${MEDTRACK_S3_ACCESS_KEY:${aws.s3.access-key:}}
    secret-key: ${MEDTRACK_S3_SECRET_KEY:${aws.s3.secret-key:}}
    prefix: ${MEDTRACK_S3_PREFIX:${aws.s3.prefix:patient-documents}}
  # Razorpay test/live keys. Empty = UPI QR + screenshot still work.
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  payment:
    upi-id: ${MEDTRACK_UPI_ID:medtrackpharmacy@upi}
  # Actuator probes for optional standalone microservices
  status:
    probe-timeout-ms: 2000
    services:
      - name: schedule-service
        port: 8081
        url: http://localhost:8081/actuator/health
        embedded: true
      - name: visit-service
        port: 8082
        url: http://localhost:8082/actuator/health
        embedded: true
      - name: notification-service
        port: 8083
        url: http://localhost:8083/actuator/health
        embedded: true
      - name: booking-service
        port: 8084
        url: http://localhost:8084/actuator/health
        embedded: true
      - name: doctor-service
        port: 8085
        url: http://localhost:8085/actuator/health
        embedded: false
      - name: hrm-service
        port: 8086
        url: http://localhost:8086/actuator/health
        embedded: true
      - name: gateway
        port: 8090
        url: http://localhost:8090/actuator/health
        embedded: true

# ---------------------------------------------------------------------------
# Spring Boot Actuator — service health / status
# http://localhost:8090/actuator/health
# http://localhost:8090/actuator/info
# http://localhost:8090/api/system/status  (aggregated)
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
  health:
    db:
      enabled: true
    mail:
      enabled: false
    diskspace:
      enabled: true

info:
  app:
    name: medtrack-app
    description: MedTrack unified API (booking, visit, schedule, notify, hrm)
    java: ${java.version:17}
